name: Web tests
on:
  push:
    paths: ['*.js', '*.html', 'styles.css', 'tests/**', '.github/workflows/tests.yml']
  pull_request:
    paths: ['*.js', '*.html', 'styles.css', 'tests/**', '.github/workflows/tests.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install patchright==1.62.1
      - run: patchright install --with-deps chromium
      - run: python -B -m unittest discover -s tests -v
