<div class="layout">
  <div class="filters-col">
    <button class="filter-toggle-btn" id="filter-toggle" type="button">Ocultar filtros</button>
  <aside class="sidebar">
    <div class="sidebar-section">
      <label class="sidebar-label" for="sort-select">Ordenar por</label>
      <select id="sort-select">
        <option value="discount" selected>Mayor descuento</option>
        <option value="newest">Novedades</option>
        <option value="default">Recomendado</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="name">Nombre A-Z</option>
      </select>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label" for="discount-range">Descuento mínimo</label>
      <input type="range" id="discount-range" min="1" max="50" step="1" value="1">
      <div class="range-value" id="discount-value">1% de descuento</div>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label" for="price-range">Precio máximo</label>
      <input type="range" id="price-range" min="0" max="200" step="5" value="200">
      <div class="range-value-row">
        <input type="number" id="price-input" min="0" max="200" step="1" value="200" inputmode="numeric">
        <span>€</span>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Tipo de compra</div>
      <label class="filter-option">
        <input type="checkbox" data-status="compra_directa" checked>
        <span>Disponible</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-status="invitacion" checked>
        <span>Invitación</span>
      </label>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Tienda</div>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="ES" checked>
        <span>Amazon ES</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="UK" checked>
        <span>Amazon UK</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="US" checked>
        <span>Amazon USA</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="ECI" checked>
        <span>El Corte Inglés</span>
      </label>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Categoría</div>
      <label class="filter-option">
        <input type="checkbox" data-category="Sobres" checked>
        <span>Sobres</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-category="Cajas ETB" checked>
        <span>Cajas ETB</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-category="Cajas de Colección" checked>
        <span>Cajas de Colección</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-category="Colecciones premium" checked>
        <span>Colecciones premium</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-category="Latas" checked>
        <span>Latas</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-category="Otros" checked>
        <span>Otros</span>
      </label>
    </div>
  </aside>
  </div>

  <main class="content">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search" placeholder="Buscar producto..." autocomplete="off">
        </div>
        <div class="count-group">
          <div class="count" id="count"></div>
          <div class="active-filters" id="active-filters"></div>
        </div>
      </div>
      <div class="view-toggle" role="group" aria-label="Vista de productos">
        <button class="view-btn" data-view="view-3" aria-label="3 por fila" aria-pressed="true">
          <span class="view-icon"><span></span><span></span><span></span></span>
        </button>
        <button class="view-btn" data-view="view-5" aria-label="5 por fila" aria-pressed="false">
          <span class="view-icon"><span></span><span></span><span></span><span></span><span></span></span>
        </button>
        <button class="view-btn" data-view="view-list" aria-label="Lista" aria-pressed="false">
          <span class="view-icon list-icon"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
    <div class="grid view-3" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No se encontraron productos.</div>
