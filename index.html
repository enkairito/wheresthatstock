<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where's That Stock — Avisos de restock TCG</title>
<meta name="description" content="Consulta en directo el stock de productos de Pokémon TCG en Amazon España.">
<link rel="icon" type="image/jpeg" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --fg: #0a0a0a;
    --muted: #6b6b6b;
    --border: #e5e5e5;
    --card-bg: #fafafa;
    --accent: #ffcb05;
    --accent-fg: #0a0a0a;
    --available: #1a9e4a;
    --available-bg: #e7f7ee;
    --invitation: #a9720a;
    --invitation-bg: #fdf3e0;
    --unavailable: #8a8a8a;
    --unavailable-bg: #f0f0f0;
    --live-dot: #1a9e4a;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e0e0e;
      --fg: #f5f5f5;
      --muted: #a3a3a3;
      --border: #262626;
      --card-bg: #171717;
      --available-bg: #10321f;
      --invitation-bg: #33240a;
      --unavailable-bg: #232323;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e0e0e;
    --fg: #f5f5f5;
    --muted: #a3a3a3;
    --border: #262626;
    --card-bg: #171717;
    --available-bg: #10321f;
    --invitation-bg: #33240a;
    --unavailable-bg: #232323;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Montserrat', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  header {
    padding: 28px 20px 20px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }

  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid var(--border);
    display: block;
    margin: 0 auto 10px;
  }

  .handle {
    display: block;
    color: var(--muted);
    font-weight: 700;
    font-size: 0.85rem;
    text-decoration: none;
    margin-bottom: 4px;
  }
  .handle:hover { color: var(--fg); }

  .logo {
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    letter-spacing: -0.02em;
    margin: 0;
  }
  .logo span { color: var(--accent); -webkit-text-stroke: 1px var(--fg); }

  .tagline {
    color: var(--muted);
    font-weight: 700;
    font-size: 0.95rem;
    margin: 6px 0 18px;
  }

  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--muted);
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
  }
  .live .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--live-dot);
    box-shadow: 0 0 0 0 rgba(26,158,74,0.6);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(26,158,74,0.55); }
    70% { box-shadow: 0 0 0 8px rgba(26,158,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(26,158,74,0); }
  }

  .layout {
    max-width: 1800px;
    margin: 0 auto;
    padding: 24px 40px 60px;
    display: flex;
    align-items: flex-start;
    gap: 28px;
  }

  .sidebar {
    flex: 0 0 260px;
    position: sticky;
    top: 20px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }
  .content { flex: 1; min-width: 0; }

  .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
  .sidebar-label {
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }

  .search-box { position: relative; }
  .search-box input,
  .sidebar select {
    width: 100%;
    padding: 13px 16px 13px 40px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--card-bg);
    color: var(--fg);
    font-family: inherit;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .sidebar select { padding-left: 14px; cursor: pointer; }
  .search-box input:focus, .sidebar select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .search-box::before {
    content: "🔍";
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 0.9rem;
  }

  .sidebar input[type="range"] {
    width: 100%;
    accent-color: var(--fg);
  }
  .range-value { font-size: 0.82rem; font-weight: 700; color: var(--muted); }

  .filter-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 0;
    font-size: 0.88rem;
    font-weight: 700;
    color: var(--fg);
    cursor: pointer;
  }
  .filter-option input { width: 16px; height: 16px; accent-color: var(--fg); cursor: pointer; flex: none; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .count { color: var(--muted); font-weight: 700; font-size: 0.85rem; }

  .view-toggle { display: flex; gap: 6px; flex: none; }
  .view-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 32px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    background: var(--card-bg);
    cursor: pointer;
    padding: 0;
  }
  .view-btn[aria-pressed="true"] { background: var(--fg); border-color: var(--fg); }
  .view-icon { display: flex; align-items: center; gap: 2px; height: 16px; }
  .view-icon span { display: block; width: 3px; height: 100%; background: var(--fg); border-radius: 1px; }
  .view-btn[aria-pressed="true"] .view-icon span { background: var(--bg); }
  .view-icon.list-icon { flex-direction: column; justify-content: space-between; width: 16px; height: 13px; gap: 0; }
  .view-icon.list-icon span { width: 100%; height: 2px; }

  .grid {
    display: grid;
    gap: 16px;
  }
  .grid.view-3 { grid-template-columns: repeat(3, 1fr); }
  .grid.view-5 { grid-template-columns: repeat(5, 1fr); }
  .grid.view-list { grid-template-columns: 1fr; }

  .grid.view-list .card { flex-direction: row; }
  .grid.view-list .card-img { width: 160px; flex: none; }
  .grid.view-list .card-body { justify-content: center; }
  .grid.view-list .card-name { -webkit-line-clamp: 2; }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
    .sidebar { position: static; flex: none; width: 100%; }
    .grid.view-3, .grid.view-5 { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .grid.view-3, .grid.view-5 { grid-template-columns: 1fr; }
    .grid.view-list .card { flex-direction: column; }
    .grid.view-list .card-img { width: 100%; }
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .card-img {
    position: relative;
    aspect-ratio: 1 / 1;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
  }
  .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

  .card-corner {
    position: absolute;
    top: 6px;
    left: 6px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-wrap: wrap;
  }
  .corner-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 22px;
    min-width: 22px;
    padding: 3px 6px;
    border-radius: 8px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
  .corner-icon img { height: 100%; width: auto; max-width: 64px; object-fit: contain; }
  .card-corner .badge { box-shadow: 0 1px 4px rgba(0,0,0,0.2); }
  .card-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; justify-content: flex-end; }
  .card-name {
    font-size: 0.88rem;
    font-weight: 700;
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .badge {
    font-size: 0.72rem;
    font-weight: 800;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge.status.available { background: var(--available-bg); color: var(--available); }
  .badge.status.invitation { background: var(--invitation-bg); color: var(--invitation); }
  .badge.status.unavailable { background: var(--unavailable-bg); color: var(--unavailable); }

  .price-row { display: flex; align-items: baseline; gap: 8px; }
  .price { font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 1.05rem; }
  .price-original { color: var(--muted); text-decoration: line-through; font-size: 0.82rem; font-weight: 700; }
  .stock-note { font-size: 0.72rem; font-weight: 800; color: var(--invitation); }

  .buy-btn {
    display: block;
    text-align: center;
    text-decoration: none;
    background: var(--fg);
    color: var(--bg);
    font-weight: 800;
    font-size: 0.85rem;
    padding: 10px;
    border-radius: 10px;
    margin-top: 4px;
  }
  .buy-btn.disabled {
    background: var(--unavailable-bg);
    color: var(--muted);
    pointer-events: none;
  }

  .empty {
    text-align: center;
    color: var(--muted);
    font-weight: 700;
    padding: 60px 20px;
  }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 600;
    padding: 30px 20px;
  }
  footer a { color: inherit; }
</style>
</head>
<body>

<header>
  <img class="avatar" src="assets/logo.jpg" alt="Where's That Shiny">
  <a class="handle" href="https://www.instagram.com/wheresthatshiny/" target="_blank" rel="noopener">@wheresthatshiny</a>
  <h1 class="logo">Where's That <span>Stock</span></h1>
  <p class="tagline">Restocks de Pokémon TCG, al minuto</p>
  <div class="live"><span class="dot"></span><span id="live-text">Cargando...</span></div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="search-box">
        <input type="text" id="search" placeholder="Buscar producto..." autocomplete="off">
      </div>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label" for="sort-select">Ordenar por</label>
      <select id="sort-select">
        <option value="default">Recomendado</option>
        <option value="price-asc">Precio: menor a mayor</option>
        <option value="price-desc">Precio: mayor a menor</option>
        <option value="discount">Mayor descuento</option>
        <option value="name">Nombre A-Z</option>
      </select>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label" for="discount-range">Descuento mínimo</label>
      <input type="range" id="discount-range" min="0" max="50" step="5" value="0">
      <div class="range-value" id="discount-value">0% de descuento</div>
    </div>

    <div class="sidebar-section">
      <label class="sidebar-label" for="price-range">Precio máximo</label>
      <input type="range" id="price-range" min="0" max="200" step="5" value="200">
      <div class="range-value" id="price-value">200 €</div>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Tipo de compra</div>
      <label class="filter-option">
        <input type="checkbox" data-status="compra_directa" checked>
        <span>🛒 Disponible</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-status="invitacion" checked>
        <span>🎟️ Invitación</span>
      </label>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-label">Tienda</div>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="ES" checked>
        <span>🇪🇸 Amazon ES</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="UK" checked>
        <span>🇬🇧 Amazon UK</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="US" checked>
        <span>🇺🇸 Amazon USA</span>
      </label>
      <label class="filter-option">
        <input type="checkbox" data-marketplace="ECI" checked>
        <span>🇪🇸 El Corte Inglés</span>
      </label>
    </div>
  </aside>

  <main class="content">
    <div class="toolbar">
      <div class="count" id="count"></div>
      <div class="view-toggle" role="group" aria-label="Vista de productos">
        <button class="view-btn" data-view="view-3" aria-label="3 por fila" aria-pressed="true">
          <span class="view-icon"><span></span><span></span><span></span></span>
        </button>
        <button class="view-btn" data-view="view-5" aria-label="5 por fila" aria-pressed="false">
          <span class="view-icon"><span></span><span></span><span></span><span></span><span></span></span>
        </button>
        <button class="view-btn" data-view="view-list" aria-label="Lista" aria-pressed="false">
          <span class="view-icon list-icon"><span></span><span></span><span></span></span>
        </button>
      </div>
    </div>
    <div class="grid view-3" id="grid"></div>
    <div class="empty" id="empty" style="display:none;">No se encontraron productos.</div>
  </main>
</div>

<footer>
  Where's That Stock · Enlaces de afiliado de Amazon ·
  <a href="https://t.me/PokeStockTCG" target="_blank" rel="noopener">Telegram</a> ·
  <a href="https://www.instagram.com/wheresthatshiny/" target="_blank" rel="noopener">Instagram</a> ·
  <a href="https://www.tiktok.com/@wheresthatshiny" target="_blank" rel="noopener">TikTok</a>
</footer>

<script>
const STATUS_LABEL = {
  compra_directa: { text: "Disponible", cls: "available" },
  invitacion: { text: "Invitación", cls: "invitation" },
  no_disponible: { text: "Agotado", cls: "unavailable" },
};

let allProducts = [];

function timeAgo(iso) {
  if (!iso) return "sin datos";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "hace instantes";
  if (mins < 60) return `hace ${mins} min`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `hace ${hours} h`;
  return `hace ${Math.floor(hours / 24)} d`;
}

const FLAG_ICONS = {
  ES: "assets/flags/es.png",
  ECI: "assets/flags/es.png",
  UK: "assets/flags/gb.png",
  US: "assets/flags/us.png",
};

// Solo Amazon (ES/UK/US) tiene el logo de Amazon; otras tiendas (ej. El
// Corte Inglés) no lo llevan salvo que se añada su propio icono a este mapa.
const STORE_ICONS = {
  ES: "assets/amazon-logo.png",
  UK: "assets/amazon-logo.png",
  US: "assets/amazon-logo.png",
  ECI: "assets/eci-logo.png",
};

function cardHtml(p) {
  const statusInfo = STATUS_LABEL[p.status] || STATUS_LABEL.no_disponible;
  const priceRow = p.price
    ? `<div class="price-row">
        ${p.original_price && p.original_price !== p.price ? `<span class="price-original">${p.original_price}</span>` : ""}
        <span class="price">${p.price}</span>
       </div>`
    : "";
  const stockNote = p.stock ? `<div class="stock-note">Solo queda(n) ${p.stock} en stock</div>` : "";
  const available = p.status === "compra_directa" || p.status === "invitacion";
  const btnLabel = p.status === "invitacion" ? "Solicitar invitación" : (available ? "Cómpralo ya" : "Agotado");
  const btnHref = available ? p.link : "#";
  const btnClass = available ? "buy-btn" : "buy-btn disabled";
  const storeLabel = `${p.store_label || "Amazon"} ${p.flag || ""}`.trim();

  return `
    <div class="card" data-name="${(p.name || "").toLowerCase()}">
      <div class="card-img">
        ${p.image ? `<img src="${p.image}" alt="${p.name}" loading="lazy">` : ""}
        <div class="card-corner" title="${storeLabel}">
          ${STORE_ICONS[p.marketplace] ? `<span class="corner-icon"><img src="${STORE_ICONS[p.marketplace]}" alt="${p.store_label || ""}"></span>` : ""}
          ${FLAG_ICONS[p.marketplace] ? `<span class="corner-icon"><img src="${FLAG_ICONS[p.marketplace]}" alt="${p.marketplace}"></span>` : ""}
          <span class="badge status ${statusInfo.cls}">${statusInfo.text}</span>
        </div>
      </div>
      <div class="card-body">
        <div class="card-name">${p.name || ""}</div>
        ${priceRow}
        ${stockNote}
        <a class="${btnClass}" href="${btnHref}" target="_blank" rel="noopener">${btnLabel}</a>
      </div>
    </div>
  `;
}

function render(products) {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  if (!products.length) {
    grid.innerHTML = "";
    empty.style.display = "block";
    count.textContent = "";
    return;
  }
  empty.style.display = "none";
  count.textContent = `${products.length} producto${products.length === 1 ? "" : "s"}`;
  grid.innerHTML = products.map(cardHtml).join("");
}

function parsePrice(value) {
  if (!value) return null;
  const match = String(value).match(/(\d{1,3}(?:\.\d{3})*),(\d{2})/);
  if (!match) return null;
  return parseFloat(match[1].replace(/\./g, "") + "." + match[2]);
}

function discountPercent(p) {
  const orig = parsePrice(p.original_price);
  const cur = parsePrice(p.price);
  if (!orig || !cur || orig <= cur) return 0;
  return Math.round(((orig - cur) / orig) * 100);
}

let activeStatuses = new Set(["compra_directa", "invitacion"]);
let activeMarketplaces = new Set(["ES", "UK", "US", "ECI"]);
let minDiscount = 0;
let maxPrice = Infinity;
let sortMode = "default";

function sortProducts(products) {
  const sorted = products.slice();
  if (sortMode === "price-asc") {
    sorted.sort((a, b) => (parsePrice(a.price) ?? Infinity) - (parsePrice(b.price) ?? Infinity));
  } else if (sortMode === "price-desc") {
    sorted.sort((a, b) => (parsePrice(b.price) ?? -Infinity) - (parsePrice(a.price) ?? -Infinity));
  } else if (sortMode === "discount") {
    sorted.sort((a, b) => discountPercent(b) - discountPercent(a));
  } else if (sortMode === "name") {
    sorted.sort((a, b) => (a.name || "").localeCompare(b.name || "", "es"));
  }
  return sorted;
}

function applyFilter() {
  const q = document.getElementById("search").value.trim().toLowerCase();
  const filtered = allProducts.filter(p => {
    const matchesStatus = activeStatuses.has(p.status);
    const matchesMarketplace = activeMarketplaces.has(p.marketplace);
    const matchesSearch = !q || (p.name || "").toLowerCase().includes(q);
    const matchesDiscount = discountPercent(p) >= minDiscount;
    const price = parsePrice(p.price);
    const matchesPrice = price === null || price <= maxPrice;
    return matchesStatus && matchesMarketplace && matchesSearch && matchesDiscount && matchesPrice;
  });
  render(sortProducts(filtered));
}

document.getElementById("search").addEventListener("input", applyFilter);

document.getElementById("sort-select").addEventListener("change", (e) => {
  sortMode = e.target.value;
  applyFilter();
});

const discountRange = document.getElementById("discount-range");
const discountValue = document.getElementById("discount-value");
discountRange.addEventListener("input", (e) => {
  minDiscount = Number(e.target.value);
  discountValue.textContent = `${minDiscount}% de descuento`;
  applyFilter();
});

const priceRange = document.getElementById("price-range");
const priceValue = document.getElementById("price-value");
priceRange.addEventListener("input", (e) => {
  maxPrice = Number(e.target.value);
  priceValue.textContent = `${maxPrice} €`;
  applyFilter();
});

function setupCheckboxGroup(containerSelector, dataAttr, activeSet) {
  document.querySelectorAll(`${containerSelector} input[data-${dataAttr}]`).forEach(checkbox => {
    checkbox.addEventListener("change", () => {
      const value = checkbox.dataset[dataAttr];
      if (checkbox.checked) {
        activeSet.add(value);
      } else {
        activeSet.delete(value);
      }
      applyFilter();
    });
  });
}

setupCheckboxGroup(".sidebar", "status", activeStatuses);
setupCheckboxGroup(".sidebar", "marketplace", activeMarketplaces);

const grid = document.getElementById("grid");
const viewButtons = document.querySelectorAll(".view-btn");

function setView(view) {
  grid.classList.remove("view-3", "view-5", "view-list");
  grid.classList.add(view);
  viewButtons.forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  try { localStorage.setItem("wts-view", view); } catch (e) {}
}

viewButtons.forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
});

try {
  const savedView = localStorage.getItem("wts-view");
  if (savedView) setView(savedView);
} catch (e) {}

fetch("products.json?t=" + Date.now())
  .then(r => r.json())
  .then(data => {
    allProducts = data.products || [];
    document.getElementById("live-text").textContent = "Actualizado " + timeAgo(data.updated_at);

    const prices = allProducts.map(p => parsePrice(p.price)).filter(v => v !== null);
    const dataMax = prices.length ? Math.ceil(Math.max(...prices) / 5) * 5 : 200;
    priceRange.max = dataMax;
    priceRange.value = dataMax;
    maxPrice = dataMax;
    priceValue.textContent = `${dataMax} €`;

    render(sortProducts(allProducts));
  })
  .catch(() => {
    document.getElementById("live-text").textContent = "No se pudo cargar el stock";
    document.getElementById("empty").style.display = "block";
